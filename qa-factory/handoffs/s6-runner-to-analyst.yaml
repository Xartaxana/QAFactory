# S6 -> S7: the run is handed to the failure analyst.
#
# The analyst gives every failure a verdict with evidence, so what it needs is not the summary but
# the join: which row, which instance, which artifact, on which build. A row the reducer could not
# join to a manifest instance decided `execution_status` for a whole story once, and nothing said
# it was a ghost - so this file names the ghosts too, and says which rerun superseded them.
#
# `env_blocked` rows carry a remedy and the `env_probe` line that failed. A blocked row with no
# remedy is refused by `validate_artifacts.py`, and rightly: "the stand is wrong" with nothing to
# do about it is not a finding, it is a shrug.
schema_version: 1
contract: s6-runner-to-analyst
stage: S6
from_role: qa-runner
to_role: qa-failure-analyst

inputs:
  - path: work/handoffs/<dispatch>.yaml
    what: this file
    required: true
  - path: work/run-report.json
    what: the whole-story report, reduced by finalize_task.py and never hand-written
    required: true
  - path: work/automation-manifest.json
    what: the instances the rows join to, with their cases and obligations
    required: true
  - path: work/evidence/
    what: the artifact behind every row - logs, screenshots, manual observations
    required: true
  - path: test-plan.md
    what: each row's oracle
    required: true

inputs_read:
  - path: work/handoffs/<the automator's file>.yaml
    version: <its window id>
    instances_handed: <n>
  - path: work/handoffs/<the designer's manual file>.yaml
    version: <its window id>
    manual_cases_handed: <n>
  - path: <the runtime_provenance record>
    version: <the application build actually probed, before and after the run>

header:
  role: qa-runner
  stage: S6
  window: <the block ids this dispatch ran>
  verdict: <one of vocabulary.header_verdicts>

run:
  execution_status: <one of vocabulary.execution_status>
  report: work/run-report.json
  witness: <the run_suite summary with the exit code and the totals line>
  environment: <the stand id>
  application_build: <what was actually running, from the probe - not from the plan>
  probe_before: <path of the record>
  probe_after: <path of the record>
  totals: "<passed / failed / error / skipped / not_run, as the report counted them>"
  # The reduced report counts every attempt the story ever made: on TP1-13797 `totals` read
  # 69 not_run beside a current window of 20 rows. The next role is answering about THIS window,
  # so the window's own numbers travel beside the story's.
  window_totals: "<the same counts for the rows this dispatch produced>"

# One row per item executed or deliberately not executed. `state` from vocabulary.row_states:
# passed, failed, error, skipped, not_run, passed_green (a reused receipt), inconclusive,
# manual_skipped, env_blocked, broken_run, timeout.
scope:
  - id: <instance or case id>
    state: <one of vocabulary.row_states>   # `blocked` needs `blocked.problem` below; the stand's word is `blocked_by_env`; a factory refusal of your run is `header.verdict: halt`
    reason: <= 80 characters>
    case: <case id>
    obligations: "<the obligation ids it discharges>"
    executed: <fresh|reused|none>
    rerun_reason: <the exact fingerprint or provenance that moved, when this was rerun>
    evidence: <work/evidence/... - the artifact, not the claim>
    duration: <seconds, or a dash>

# Manual-agent observations, compared with the Then as the case quoted it. This is the section
# that makes `inconclusive` an answer instead of an improvisation.
manual_observations:
  - case: <case id>
    then: "<the expectation, quoted from the case>"
    observed: "<what was actually seen, in the product's own terms>"
    before_change: "<the record's before_change - r, value, ref and source claim or not_recorded - as built by code; not_recorded is never read as unchanged>"
    result: <passed|failed|inconclusive|manual_skipped>
    evidence: <path>
    why_inconclusive: <what the observation failed to settle, when it did>
    surprises: "<the record's surprises[] (id, step, word, kind, fact, evidence) and surprise_detection, as built by code from the recorder's lines; a line an observation cites with `surprise: <id>` is judged inside that observation, every other line is a target `<case>#sur-<id>` for the analyst (at most 30; the rest are one `<case>#sur-overflow`). surprise_detection other than `on` means the page was not fully watched: no surprise is not 'nothing happened'>"

# Rows blocked by the stand. Every one names the remedy - names only, never a value - and the
# `env_probe.py` line that failed.
env_blocked:
  - id: <instance or case id>
    probe_line: <the env_probe check that failed, verbatim>
    remedy: <the exact change, by name>
    owner: <factory|user>

# Rows that exist in the report but are not evidence about this story: a ghost the reducer could
# not join, superseded by a rerun under the real instance ids.
superseded:
  - row: <the ghost row id>
    superseded_by: <the instance id that replaced it>
    note: "a rerun is a repair, not an attempt anyone has to waive"

claims:
  every_row_carries_an_evidence_path: <true|false>
  every_blocked_row_names_a_remedy_and_the_probe_line: <true|false>
  no_comparison_was_fabricated_where_before_evidence_is_missing: <true|false>
  handed_and_manual_human_cases_are_absent_by_design: <true|false>
  the_report_was_reduced_by_code_not_written: <true|false>

expected_of_the_receiver:
  - "triage every `failed`, every `error`, and every `inconclusive` - an inconclusive check has
     an owner and a next step and never reaches gate B untouched"
  - "a red instance carrying `contradicts_requirement` goes through your triage. A red on an
     extra or different value gets the control experiment first; the expectation is never
     adjusted to the code"
  - "a FLAKY verdict needs three isolated reruns of that one test and a named mechanism"

# What you ran and saw, one line per window, with the path of your `tried.md` (spec t-1765 X7-7, E-14): the analyst reads it against
# your Good outcome. Empty only with `tried_note` saying why nothing was tried. Distinct from `blocked.tried` below, which is what
# failed while filling this form.
tried:
  - requirement: <the window: its case ids or its area>
    technique: <what you ran in that window (the command or the steps)>
    observation: <what you saw, in one line>
    evidence: <the path of tried.md (and anchor) where it shows>
tried_note: <why the table is empty, or a dash when it has rows>

unresolved:
  - id: <instance or case id>
    reason: <one of vocabulary.unresolved_reasons>
    detail: <what exactly is missing, and what would settle it>

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>
