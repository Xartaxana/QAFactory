# S7: the failure analyst hands a repair to the automator.
#
# Only TEST_BUG, TEST_BUG:collection and FLAKY are repaired, two rounds per test. A finding that does
# not say what the reviewer expects costs half that budget on a guess, so this file carries the same
# `expected` and `check` as the S5 review plus the EVIDENCE the verdict rests on, by path: the author
# is told its own test is wrong and is entitled to see why.
#
# An APP_BUG's EXPECTATION never reaches the automator: it is not adjusted to the code, ever. The one
# thing an APP_BUG row hands over is a `reorder` (`kind: reorder`, the row carries `reorder: true` and
# `blocked_thens`): the author MOVES the asserts of the independent Thens above the red one - Then lines
# and expected values unchanged, the test staying red at the same Then - and a code critic reviews that
# one test (`s7_reorder.py`, `phases/s7.md`). A row that asks for it is a repair: the empty `scope` is
# not accepted while one stands. A CASE_DEFECT goes back to the designer through
# `controller.py --operation rework`, not here.
#
# NOTHING TO REPAIR is a result, not a gap (FR-23). With no TEST_BUG, TEST_BUG:collection or FLAKY row,
# leave `scope` empty (`scope: []`, `repairs: []`) and list EVERY triage row under `not_for_repair`.
# The empty `scope` is accepted only while `work/triage.json` agrees: it reads, holds at least one row,
# no row carries a repair verdict (a FLAKY row already fixed still counts), every row is listed below and
# nothing is listed that the triage does not hold. With no triage row at all, only a run report that shows
# no failed result and no manual check that failed or was inconclusive passes. `handoff_check.py --fix`
# opens the `not_for_repair` rows (id, verdict) from the triage; you write `where_it_went`. In the
# header, `window: none` says the same and is accepted only with an empty `scope`.
#
# A `source: code` row (NOT_EXECUTED) and a RUNNER_MISREAD_EVIDENCE row (see its `contradiction` block)
# are triage rows like any other here, and neither is a repair: list it under `not_for_repair`,
# `where_it_went` naming who owns it. You may replace a `source: code` row in the triage with your own;
# code never writes over yours. A misread goes back to the runner for a re-judge, no new run, and S7
# stays open until the runner has judged it again.
schema_version: 1
contract: s7-analyst-to-automator
stage: S7
from_role: qa-failure-analyst
to_role: qa-automator

# The contract's own exception to "every handover has items" (handoff.null_outcomes). The check reads
# it; it is not a field you fill.
null_outcome:
  scope:
    condition: triage_has_no_repair
    params:
      repair_verdicts: [TEST_BUG, "TEST_BUG:collection", FLAKY]
      listed_in: not_for_repair
    words:
      header.window:
        word: none
        means: "nothing is handed for repair"
    source: work/triage.json

inputs:
  - path: work/handoffs/<dispatch>.yaml
    what: this file
    required: true
  - path: work/triage.json
    what: the verdict row behind every repair below
    required: true
  - path: work/automation-manifest.json
    what: the instance, its case link and its selector
    required: true
  - path: <the evidence paths named per repair>
    what: the log, the artifact or the rerun series the verdict rests on
    required: true

inputs_read:
  - path: work/run-report.json
    version: <the report the triage was taken from>
    failures: <how many rows were triaged>
  - path: <the runtime_provenance record>
    version: <the build the failures happened on>

header:
  role: qa-failure-analyst
  stage: S7
  window: <the instance ids handed for repair>
  verdict: <one of vocabulary.header_verdicts>

# One row per repair. `state` is the triage verdict (TEST_BUG, TEST_BUG:collection, FLAKY) or `reorder`
# for a triage row that carries `reorder: true`; it comes from the restricted part of vocabulary.row_states
# - only this role may write one. `id` is the instance id of the red test, `case` its case, `round` the
# repair round it is in. The row says WHICH test is repaired; `repairs` below says HOW. No repair at all:
# `scope: []`, see the top.
scope:
  - id: <instance id>
    state: <TEST_BUG|TEST_BUG:collection|FLAKY|reorder>
    reason: <= 80 characters>
    case: <case id>
    round: <r of 2>

repairs:
  - id: <instance id>
    kind: <repair|reorder>
    verdict: <TEST_BUG|TEST_BUG:collection|FLAKY|APP_BUG>
    evidence: <path of the log or artifact the verdict rests on>
    problem: <what the test does wrong, one sentence - about the test, never about the product>
    expected: "<what the test should do instead, concretely - the assertion, the fixture, the
                wait condition, the selector>"
    fix: <what to change, one sentence>
    check: <the command that shows the author it is satisfied - normally the repair_verify run>
    mechanism: <one of vocabulary.flaky_mechanisms - isolation|race|timing|shared_state|teardown|environment|unknown>   # FLAKY only
    rerun_series: <path of the three isolated reruns that proved the flakiness>    # FLAKY only
    then_lines: "<the Then lines as they stand now - they must read the same after the fix>"

# The verdicts that are NOT repaired, listed so the automator can see its window is complete and
# does not go looking for work that is not its own. With an empty `scope` this list is the whole
# triage: one row per triage row, by its instance id (a manual check, by its case id).
not_for_repair:
  - id: <instance id>
    verdict: <APP_BUG|ENV_ISSUE|APP_CHANGED|CASE_DEFECT|ASSERT_STRICTER|NOT_EXECUTED|RUNNER_MISREAD_EVIDENCE|NO_DEFECT>
    where_it_went: <bug draft path | the stage that owns it | the rework dispatch | "Left with you" for ASSERT_STRICTER - the person decides | "the runner judges it again" for RUNNER_MISREAD_EVIDENCE - the driver sends the check back to S6>

rules:
  - "retry annotations and sleeps are forbidden"
  - "the Then lines before and after the fix must match - a repair that changes the expectation
     is not a repair, it is a new case and it needs the designer"
  - "after each round, rerun ONLY the failed instance, through a typed repair_verify request"
  - "two rounds, then the test is `not_verified_flaky` and `delivery_ready` turns to no -
     quarantine is a gate B decision with a debt file and a trigger, never yours"

claims:
  every_repair_names_evidence_expected_and_check: <true|false>
  no_app_bug_expectation_was_handed_for_repair: <true|false>
  every_flaky_verdict_carries_three_isolated_reruns_and_a_mechanism: <true|false>

unresolved:
  - id: <instance id>
    reason: <one of vocabulary.unresolved_reasons>
    detail: <what exactly is missing, and what would settle it>

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>
