# S4: the case designer hands the pinned cases to the case critic.
#
# The critic reviews PINNED versions and nothing else, so this file names the version of every
# case it hands over. Pinning is the orchestrator's step (`case_versions.py --all`, then
# `--verify`) and the designer has no Bash, so the version has to arrive in writing.
#
# `review_scope` is the second reason this file exists: nothing else computes the critic's scope.
schema_version: 1
contract: s4-designer-to-case-critic
stage: S4
from_role: qa-case-designer
to_role: qa-case-critic

inputs:
  - path: work/handoffs/<dispatch>.yaml
    what: this file
    required: true
  - path: <cases_root>/<area>/<case>.md
    what: every case in `scope`, at the pinned version named here
    required: true
  - path: work/test-plan.json
    what: the rows these cases answer, with their obligations and oracles
    required: true
  - path: work/requirements-register.md
    what: the oracle behind the plan row - an existing test is never one
    required: true
  - path: state/story-case-links.json
    what: the pins, written by case_versions.py
    required: true

inputs_read:
  - path: work/test-plan.json
    version: <plan_revision>
    rows: <how many rows carried a case-bearing disposition>
  - path: work/requirements-register.md
    version: <hash>

header:
  role: qa-case-designer
  stage: S4
  window: <the case ids of this dispatch>
  verdict: <one of vocabulary.header_verdicts>

# One row per case. `state` from vocabulary.row_states: created, updated, deferred, blocked,
# handed_to_person, impossible.
scope:
  - id: <case id>
    state: <one of vocabulary.row_states>   # `blocked` needs `blocked.problem` below; a factory refusal of your run is `header.verdict: halt`
    reason: <= 80 characters>
    plan_row: <P-n>
    obligations: "<the obligation ids of that row, quoted unchanged>"
    requirements: "<the R-ids the case proves>"
    case_version: <the pinned cv_ id of the bytes handed over>
    origin: <new|extended|reused>
    reuse_of: <the existing case this extends or replaces, or a dash>
    disposition: <automate|manual-agent|manual-human>
    design_review_required: <true|false>
    self_probe: <what the designer checked itself - the seeded defect, the bounded negative,
                 the fixture substitution - or a dash with why not>

# The critic's scope, computed from `design_review_required` and stated here. The critic reviews
# exactly this set and answers for each id; anything outside it is `review_skipped` by rule.
review_scope:
  cases: "<the case ids whose validated design_review_required is true>"
  rounds_used: <how many repair rounds these cases have already had, of the two allowed>
  focus:
    - "<what the designer knows is weak here, in one line - the honest pointer that saves a round>"

artifacts:
  cases_root: <the store the cases really live in - config.cases_root or work/test-cases>
  case_links: state/story-case-links.json
  appendix: <work/case-appendix.md, when it has been rendered>

claims:
  every_case_bearing_plan_row_has_at_least_one_case: <true|false>
  every_case_quotes_its_rows_obligation_ids: <true|false>
  every_case_in_scope_is_pinned_and_the_version_is_named: <true|false>
  every_case_names_the_requirement_it_proves_not_a_test: <true|false>
  existing_cases_were_checked_before_new_ones_were_written: <true|false>

expected_of_the_receiver:
  - "answer for every id in `review_scope.cases` by name - an unreviewed row makes the verdict
     `partial`, and its id reaches the gate A message"
  - "review the pinned `case_version` above; a review of bytes that have since changed is not a
     review of this window"
  - "every finding carries `expected` and `check` - see s4-case-critic-to-designer"

# What you tried and saw, one row per attempt: the acceptor of the stage reads it against your Good outcome
# (spec t-1765 B3). Empty only with `tried_note` saying why nothing was tried (a grounding window, a repair of
# named findings). Distinct from `blocked.tried` below, which is what failed while filling this form.
tried:
  - requirement: <R-n, a source id or an area>
    technique: <the technique by its name in your charter>
    observation: <what you saw, in one line>
    evidence: <the path (and anchor) where it shows>
tried_note: <why the table is empty, or a dash when it has rows>

unresolved:
  - id: <case id or P-n>
    reason: <one of vocabulary.unresolved_reasons>
    detail: <what exactly is missing, and what would settle it>

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>
