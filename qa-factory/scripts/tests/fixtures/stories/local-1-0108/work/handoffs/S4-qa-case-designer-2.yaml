# S4: the case designer hands the pinned cases to the case critic.
#
# The critic reviews PINNED versions and nothing else, so this file names the version of every
# case it hands over. Pinning is the orchestrator's step (`case_versions.py --all`, then
# `--verify`), and the designer has no Bash - which is exactly why the version has to arrive in
# writing: on a project with its own case store, a story folder searched for cases pinned nothing
# and the gate approved an empty set.
#
# `review_scope` is the second reason this file exists. Nothing computes the critic's scope for it;
# a critic left to choose its own reviews whatever it happens to read.
# Fill: write your fields as "path: value" lines to work/handoffs/S4-qa-case-designer-2.values.yaml in one Write; a Write over this form is refused, and while that file waits an Edit here is refused too. A row of a list, one line per key: "scope[0].id": <value>, the next row "scope[1].id".
# Repair of S4-qa-case-designer-1: the fields under derived: carry its accepted answers; fill the rows of this dispatch.
schema_version: 1
contract: s4-designer-to-case-critic
stage: S4
from_role: qa-case-designer
to_role: qa-case-critic

inputs:
  - path: work/handoffs/S4-qa-case-designer-2.yaml
    what: this file
    required: true
  - path: <cases_root>/<area>/<case>.md
    what: every case in `scope`, at the pinned version named here
    required: true
  - path: work/test-plan.json
    what: the rows these cases answer, with their obligations and oracles
    required: true
  - path: work/requirements-register.md
    what: the oracle behind the plan row - an existing test is never one
    required: true
  - path: state/story-case-links.json
    what: the pins, written by case_versions.py
    required: true

inputs_read:
