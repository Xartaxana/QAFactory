  - id: cart.spec.@regression LOCAL-1_TC_019 the catalog card adds the book to the cart with the right line
    verdict: CASE_DEFECT
    where_it_went: "rework dispatch to the designer (controller.py --operation rework): case pins unit price to GET /api/cart which carries none; R-4 is met on the cart page"
  - id: cart.spec.@regression LOCAL-1_TC_020 moving a wishlist item to the cart adds it and removes it from the wishlist
