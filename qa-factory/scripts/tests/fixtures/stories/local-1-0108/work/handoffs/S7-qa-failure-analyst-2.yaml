  - id: cart.spec.@regression LOCAL-1_TC_018 add_path_obeys_the_add_rules[product_page]
    verdict: CASE_DEFECT
    where_it_went: "rework dispatch to the designer (controller.py --operation rework): case pins unit price to GET /api/cart which carries none; R-4 is met on the cart page"
  - id: cart.spec.@regression LOCAL-1_TC_018 add_path_obeys_the_add_rules[catalog_card]
    verdict: CASE_DEFECT
