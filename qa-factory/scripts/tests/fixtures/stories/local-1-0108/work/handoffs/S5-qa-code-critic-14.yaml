# S5: the code critic hands the window back — to the automator for a repair round, or on to
# the stage's close. The same file serves both: `verdict` decides which.
#
# It is the mirror of s5-automator-to-critic.yaml: what the critic read, what it proved, what
# it could not prove and why, and — when it sends the window back — what exactly the author
# must change. A finding without a `cause` and a file is not a finding.
# Fill: write your fields as "path: value" lines to work/handoffs/S5-qa-code-critic-14.values.yaml in one Write, or run handoff_check.py --file work/handoffs/S5-qa-code-critic-14.yaml --fix --values - (Bash); a Write over this form is refused, and while that file waits an Edit here is refused too. A row of a list, one line per key: "scope[0].id": <value>, the next row "scope[1].id".
schema_version: 1
contract: s5-critic-to-automator
stage: S5
from_role: qa-code-critic
to_role: qa-automator            # on `approved` the same file closes the window instead

inputs:
  - path: work/handoffs/<the automator's dispatch>.yaml
    what: the author's handoff for this window
    required: true
  - path: work/automation-manifest.json
    what: the instances under review
    required: true
  - path: work/test-cases/<area>/<case>.md
    what: every case in scope at its pinned version
    required: true

# Proof that the review read what it was handed. One line per entry of the author's
# `inputs`, with the version or hash it read — a review of a file that has since changed is
# not a review of this window.
inputs_read:
  - path: work/handoffs/S5-qa-automator-14.yaml
    version: obligation_hash added to OB-21, OB-22; test code unchanged
  - path: work/automation-manifest.json
    version: 34 tests, 93 then_bindings
  - path: work/test-cases/<area>/<case>.md
    version: LOCAL-1_TC_020 cv_3599058ee1132918ddd6; LOCAL-1_TC_021 cv_aef96c10539e27125a3e

header:
  role: qa-code-critic
  stage: S5
  window: LOCAL-1_TC_020,LOCAL-1_TC_021
  verdict: concerns

# The review's own conclusion about the window.
review:
  outcome: unverified
  findings_file: work/test-code/critic-findings-w8b.md  # required; the window is not receipted without it
  receipt_ref: work/windows/S5-qa-code-critic-14.json
  rounds_used: 0

# One row per instance reviewed. `state` from vocabulary.row_states, allowed for
# qa-code-critic: approved, approved_with_fixes, rejected, unverified, review_skipped.
scope:
  - id: cart.spec.@regression LOCAL-1_TC_020 moving a wishlist item to the cart adds it and removes it from the wishlist
    state: approved
    reason: red on unit price only, contradicts R-19; Thens 2-3 hold
  - id: cart.spec.@regression LOCAL-1_TC_021 a guest cart is merged at sign-in without losing items
    state: unverified
    reason: static review clean; TypeScript probe gap accepted by person

# Every probe this review ran, by code. A probe that did not conclude is a `tooling` finding,
# never a verdict about the test.
probes:
  # The stand the probes ran on: the same record the author handed over, re-read. A probe on
  # another build is not a probe of this window.
  runtime_provenance: evidence/runtime-provenance-web-20261102T043727Z.json
  records:
  - instance: cart.spec.@regression LOCAL-1_TC_021 a guest cart is merged at sign-in without losing items
    verdict: incomplete  # incomplete: the tool could not read the run well enough to judge the test, a tooling finding, never a verdict on the test
    record: work/probes/cart.spec.@regression-LOCAL-1_TC_021-a-guest-cart-is-merged-at-sign-in-without-losing-items.json
    note: tooling - probe tool cannot read TypeScript failure wording

# What the author must change, when the outcome sends the window back.
#
# A refusal that does not say what the reviewer expects is not a refusal, it is a riddle: the
# author then guesses, and every guess is a round (REF-30: the digest form refused four
# handoffs without ever naming the words it wanted). So every finding carries, beside the
# problem, the EXPECTED state in the reviewer's own words — what the code should do, or what
# the artifact should say — and, where one exists, the command that shows the author whether
# it is satisfied. `fix` is the action; `expected` is the condition the author can check
# against; `check` is how to check it without asking the reviewer again.
findings:
  - id: F-1
    file: tests/e2e/cart/cart.spec.ts
    line: 478
    problem: no live probe for TypeScript instance (tool gap)
    expected: a live probe receipt for the TC_021 instance
    fix: none for the author; factory probe tool
    check: -
    cause: tooling
    blocking: false

# A finding whose `cause` is `tooling` or `environment` is NOT the author's to fix and is not a
# round: the author cannot repair a factory script. It belongs in `unverified` below, with
# `would_settle_it`, and in the factory backlog. On REF-30 nine of the code critic's twelve
# findings declared `cause: tooling` - the same probe-tool scope, handed back to the author across
# four consecutive windows, and seven of them reached the person's ledger as `review_rejected`,
# which blames the work for a defect of the tool.
tooling_findings:
  - id: F-1
    tool: probe_by_code.py
    backlog_row: -
    instances: cart.spec.@regression LOCAL-1_TC_021 a guest cart is merged at sign-in without losing items

# What the review could not settle, and what would settle it. This is the honest answer that
# had no word before: a probe the tool cannot run is a gap of the factory, not of the test.
unverified:
  - id: cart.spec.@regression LOCAL-1_TC_021 a guest cart is merged at sign-in without losing items
    why: probe tool does not read TypeScript assertion failure wording
    expected: inverted assertion fails with the library message
    would_settle_it: an assertion probe entry for TypeScript in probe_by_code

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>
