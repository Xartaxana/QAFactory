# Every requirement of the register reaches a row above (named in `requirements` in work/test-plan.json and in the `R`
# column of test-plan.md): the S3 exit gate refuses a register id with no row, and an entry here never stands in for one.
# A requirement that waits for a gate A question is a row `unverifiable` with `question_refs` and `if_answered`; one that
# should not be checked is a row `skip` with the reason. Only a risk `K-n` or an area `B-n` may be named here instead of a
# row. The same holds for the grounding table: a risk `K-n` or an area `B-n` that matters reaches a plan row
# (`risk_source_refs` entry `grounding:K-n` / `blast:B-n` in work/test-plan.json) or is named here
# by `ref`; the existing tests of an area that matters stand in the plan's `## Recommended regression` section as items,
# one per test path, each signed `(blast:B-n)` (one token per area it defends), under the runner's `Command:` line.
not_planned: []

# Filled by CODE from work/grounding.yaml (handoff_check --fix); you do not write these two. Left empty
# when the story has no diff to ground.
grounding: {}

blast_radius: []

# For every manual row, what the runner will be allowed to count as evidence. Deciding this at S3
# is the rule of the phase: a runner with no policy produces an observation that settles nothing.
manual_policy:
  - {row: TS-14, executed_by: agent, evidence: "screenshots of the cart and badge before and after sign-in, plus the GET /api/cart body", required_fields: "steps taken, what was seen, every oddity", inconclusive_when: "the stand cannot hold a guest session or the observation does not answer the expected merge result"}
  - {row: TS-15, executed_by: agent, evidence: "screenshots of messages and badge for each input, plus the cart body after a double click", required_fields: "inputs typed, response shown, cart after, every oddity", inconclusive_when: "a second tab cannot be driven or stock cannot be set to the last copy"}
  - {row: TS-16, executed_by: agent, evidence: "screenshots of both browsers and cart bodies after sign-out", required_fields: "owner, cookie state, what each cart showed, every oddity", inconclusive_when: "two separate browser profiles are not available"}

budget:
  size: L
  cap: 28
  planned_rows: 20
  within_cap: true
  if_over: "nothing cut; 20 rows against a ceiling of 28"

# Regression the person may want to run. The factory does not run it and says so.
regression_recommendations:
  - suite_or_command: "npm --prefix ../MyBooks test -- src/lib/cartRules.test.ts"
    why: "the two existing unit tests (EX-1, EX-2) of the stock and merge helpers; run once as a baseline, they read the application and cover pure helpers only"

artifacts:
  plan_machine: work/test-plan.json
  plan_human: test-plan.md
  judge_plan: -

claims:
  every_register_requirement_reaches_a_row: true
  every_row_has_a_disposition_and_a_reason: true
  every_row_mints_obligation_ids: true
  every_contradiction_matrix_cell_reached_a_row: true
  no_test_was_run_in_this_stage: true
  every_hunk_of_the_diff_has_a_grounding_row: true
  every_register_requirement_has_a_grounding_line: true
  every_risk_and_uncovered_area_reaches_a_row_or_not_planned: true
  every_area_that_matters_has_regression_or_a_gap: true

expected_of_the_receiver:
  - "one or more cases per row with `automate` or a manual disposition, and per row with `skip` or `unverifiable` whose
     `if_answered` sets one of those for an open question (quote the question in `question_thens`); any other `skip` or
     `unverifiable` row gets no case and is not re-argued"
  - "every case quotes the obligation ids of its row - unchanged, not re-derived"
  - "reuse or extend an existing case before writing a new one, as the row says"
  - "a row with `source_conflict` or `oracle_unknown` keeps both readings in the case, and the
     contested assertion is not automated until the owner answers at gate A"

# What you tried and saw, one row per attempt: the acceptor of the stage reads it against your Good outcome
# (spec t-1765 B3). Empty only with `tried_note` saying why nothing was tried (a grounding window, a repair of
# named findings). Distinct from `blocked.tried` below, which is what failed while filling this form.
tried:
  - {requirement: R-12, technique: "mutation thinking", observation: "LoginPage.tsx:36 only logs a failed merge, so a flipped check would not turn any existing test red; planned as expected red", evidence: "work/test-plan.json#TS-6"}
  - {requirement: R-7, technique: "boundary value analysis", observation: "EX-1 covers the helper only; the stock edge through the service has no test", evidence: "work/test-plan.json#TS-9"}
  - {requirement: R-4, technique: "risk-based testing", observation: "data-loss merge rules sit on the lowest rung that reaches the database (api), the page failure on e2e-ui", evidence: "work/test-plan.json#TS-5"}
  - {requirement: R-10, technique: "defect hypothesis first", observation: "scout note says PATCH, contract and code say PUT; planned on PUT, source conflict shown at gate A", evidence: "work/requirements-register.md#Reading forks"}
  - {requirement: R-14, technique: "defect hypothesis first", observation: "flow-requests list gave 25 requests; 9 are failed by rows, 16 set aside in request_homes with a reason", evidence: "work/test-plan.json#request_homes"}
tried_note: "-"

unresolved:
  - {id: TS-6, reason: contradicts_requirement, detail: "code shows login on a failed merge (LoginPage.tsx:36) against R-12; the owner picks the outcome at gate A (new question on TS-6), the test stays an expected red"}
  - {id: TS-12, reason: expectation_unconfirmed, detail: "Q2 PUT or PATCH for the quantity update; planned on PUT until answered"}
  - {id: TS-4, reason: expectation_unconfirmed, detail: "Q3 whether a move onto an item already in the cart sums the quantity; planned on summing until answered"}
  - {id: R-13, reason: expectation_unconfirmed, detail: "no fact states the wishlist delete outcome; planned on the norm that a failed call is not shown as success"}
  - {id: R-14, reason: expectation_unconfirmed, detail: "no fact states the cart page outcome on failure; planned on the same norm"}
