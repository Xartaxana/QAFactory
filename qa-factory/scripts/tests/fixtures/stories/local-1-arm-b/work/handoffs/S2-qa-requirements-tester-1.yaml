# S2 -> S3: the requirements register is handed to the strategist.
#
# The register is the story's oracle, so this file is where the factory proves the register was
# built from everything it was given. `inputs_read` is not bookkeeping: it is the answer to the
# one failure that has no refusal attached to it - a source or a diff hunk nobody opened. On
# REF-2 the tester read part of `impl-diff.txt`, wrote 14 requirements, and every later
# stage was correct about the wrong 14. The repaired run read every hunk and reached 21.
#
# The strategist may not add a requirement and may not repair one. Whatever is missing here is
# missing from the plan, the cases, the tests and the report.
# Fill: write your fields as "path: value" lines to work/handoffs/S2-qa-requirements-tester-1.values.yaml in one Write, or run handoff_check.py --file work/handoffs/S2-qa-requirements-tester-1.yaml --fix --values - (Bash); a Write over this form is refused, and while that file waits an Edit here is refused too. A row of a list, one line per key: "scope[0].id": <value>, the next row "scope[1].id".
schema_version: 1
contract: s2-tester-to-strategist
stage: S2
from_role: qa-requirements-tester
to_role: qa-test-strategist

inputs:
  - path: work/handoffs/S2-qa-requirements-tester-1.yaml
    what: this file
    required: true
  - path: work/requirements-register.md
    what: every requirement with its source, revision, impact class and observable, the branches of the requirements (`## Branches`, BN-n) and a home for every sentence of the story's text (`## Source obligations`)
    required: true
  - path: work/requirements-readiness.json
    what: the open questions with their readings and owners
    required: true
  - path: understanding.md
    what: the brief the person reads at gate A, and the Size line
    required: true
  - path: work/sizing.json
    what: the computed size, weights and the arithmetic behind them
    required: true

# One line per entry of the scout's `inputs`, with what was actually read of it. The counts come
# from the scout's handoff and the answer is `<read> of <handed>`; anything short of the whole
# is a `blocked` field, not a smaller number quietly written.
inputs_read:
  - path: work/impl-diff.txt
    handed: 0
    read: 0
  - path: work/context-bundle.json
    version: a25b0801669b
  - path: MyBooks/docs/openapi.json
    version: "sha256:776ea5d1fe9f"

