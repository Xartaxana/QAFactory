# Requirements that disagree with each other or with a source. Both readings travel: the plan row
# carries `source_conflict` or `oracle_unknown`, the design review is forced, and the owner sees
# BOTH readings at gate A. A matrix cell that reaches no plan row is an exit-gate error at S3.
contradiction_matrix:
  - id: C-1
    requirement: R-10
    contradicts: scout note says PATCH /api/cart/{id}; contract and code say PUT
    reading_a: PUT as in contract and code
    reading_b: PATCH intended; code wrong
    owner_role: dev_arch

# Questions that block understanding. Each travels whole - the statement, what the sources say and
# where, and the lettered readings with what each one costs. A question that arrives without its
# readings goes back to this role, never to the person (REF-3).
open_questions:
  - id: Q1
    statement: "Do the derived norms hold: a failed call is never shown as success (R-12, R-13, R-14)?"
    owner_role: po_ba
    severity: non_blocking
    sources_say: "No ticket states it; LoginPage.tsx:36 and WishlistPage.tsx:58 ignore the answer, CartPage.tsx:30,36 skip the status"
    readings:
      - id: a
        reading: norms hold in all three places
        cost: the code is expected red where it ignores failure
  - id: Q2
    statement: Is the quantity update PUT or PATCH on /api/cart/{id}?
    owner_role: dev_arch
    severity: non_blocking
    sources_say: "openapi.json and route.ts:8 say PUT; scout note says PATCH"
    readings:
      - id: a
        reading: PUT, the note is a slip
        cost: none
  - id: Q3
    statement: Does moving a wishlist book already in the cart grow its quantity by 1?
    owner_role: po_ba
    severity: non_blocking
    sources_say: "openapi.json sums quantity; WishlistPage.tsx:48 posts 1; story silent"
    readings:
      - id: a
        reading: quantity grows by 1
        cost: one case for branch BN-4
  - id: Q4
    statement: Is the behaviour the current code shows for R-5, R-6, R-8, R-9, R-11..R-14 the one you expect?
    owner_role: po_ba
    severity: non_blocking
    sources_say: Only the code speaks to these rows; see Behaviour claims in the register
    readings:
      - id: a
        reading: the behaviour now is intended
        cost: cases assert the current behaviour

size:
  computed: L
  override: <the role's override, or a dash>
  reasoning_ref: work/sizing.json

artifacts:
  register: work/requirements-register.md
  readiness: work/requirements-readiness.json
  understanding: understanding.md
  sizing: work/sizing.json

claims:
  every_hunk_of_the_diff_was_read: true
  every_requirement_has_an_observable_or_says_none: true
  contradiction_matrix_walked_in_full: true
  size_computed_by_sizing_py_not_quoted: true
  size_recorded_in_pipeline: false  # `null` in pipeline.json while sizing.json said XXL

expected_of_the_receiver:
  - "every requirement above reaches a plan row (a `skip` row with a reason is a row) - the
     strategist may not drop one silently and may not invent one"
  - "a row touched by the contradiction matrix carries `source_conflict: true` or
     `oracle_unknown: true` and forces design review at S4"
  - "`observable: none` is a gate A question AND a plan row (`unverifiable` with `question_refs` and `if_answered`), never a
     reason to skip the requirement; a register row marked `derived_from: bug:candidate-defect` (a suspect place in the code,
     `observable: current-code:<file>:<line>`) asks for a test row: `automate` or `manual-agent`, or `unverifiable` with a branch
     that sets one"
  - "every branch of the register (`## Branches`, BN-n) is read as a unit of its own: a plan row carries it or it is named with a reason - it is never folded into the text of its requirement"

# What you tried and saw, one row per attempt: the acceptor of the stage reads it against your Good outcome
# (spec t-1765 B3). Empty only with `tried_note` saying why nothing was tried (a grounding window, a repair of
# named findings). Distinct from `blocked.tried` below, which is what failed while filling this form.
tried:
  - requirement: R-4
    technique: Equivalence partitioning
    observation: guest-vs-user merge classes (both, guest only, no stock) are three branches with one rule
    evidence: "qa-factory/artifacts/LOCAL-1/work/requirements-register.md#branches"
  - requirement: R-6
    technique: Boundary value analysis
    observation: edges 0,1,999,1000 are named; text fixes 1..999 so none is a question
    evidence: "qa-factory/artifacts/LOCAL-1/work/requirements-register.md#branches"
  - requirement: R-12
    technique: The negative of every rule
    observation: "LoginPage.tsx:36 ignores the merge answer so a failed merge looks like success"
    evidence: qa-factory/artifacts/LOCAL-1/work/user-path-failures.json
  - requirement: R-10
    technique: Sources that disagree
    observation: scout note says PATCH, contract and route say PUT
    evidence: "qa-factory/artifacts/LOCAL-1/work/requirements-register.md#contradiction-matrix"
  - requirement: R-3
    technique: Work an example by hand
    observation: "moving a book already in the cart: two readings of the result"
    evidence: "qa-factory/artifacts/LOCAL-1/work/requirements-readiness.json#Q3"
tried_note: -

unresolved:
  - id: Q1
    reason: expectation_unconfirmed
    detail: failed-call norm awaits the person; default reading holds
  - id: R-9
    reason: handed_to_person
    detail: size_recorded_in_pipeline is false because pipeline.size is None; the conductor records it

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>

# Values code filled from the artifacts on disk when the check ran. They are the
# artifacts' word, not the author's; the receiving role may refuse any of them.
derived:
  - field: size.computed
    source: "sizing.json"
  - field: claims.size_computed_by_sizing_py_not_quoted
    source: "verified by handoff_check.CLAIMS"
