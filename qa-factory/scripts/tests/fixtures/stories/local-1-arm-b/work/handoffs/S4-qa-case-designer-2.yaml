# The critic's scope, computed from `design_review_required` and stated here. The critic reviews
# exactly this set and answers for each id; anything outside it is `review_skipped` by rule.
review_scope:
  cases: LOCAL-1_TC_004, LOCAL-1_TC_005, LOCAL-1_TC_006, LOCAL-1_TC_007, LOCAL-1_TC_008, LOCAL-1_TC_009, LOCAL-1_TC_010, LOCAL-1_TC_011, LOCAL-1_TC_012, LOCAL-1_TC_013, LOCAL-1_TC_014, LOCAL-1_TC_015, LOCAL-1_TC_016, LOCAL-1_TC_017, LOCAL-1_TC_018
  rounds_used: 1
  focus:
    - Q placeholders replaced by values from R-n and the person's Q answers (reading a); question_thens dropped
    - TC_006, TC_017, TC_018 expected red (code contradicts the norm); TC_011 asserts only 'unchanged' for the foreign PUT/DELETE (no source names a status)
    - TC_012 cart page message (R-10) is not carried by this api row; TC_014 no longer covers R-12 (TC_006 owns it); TC_015 now has an unknown-book step for R-8

artifacts:
  cases_root: test-cases
  case_links: state/story-case-links.json
  appendix: <work/case-appendix.md, when it has been rendered>

claims:
  every_case_bearing_plan_row_has_at_least_one_case: true
  every_case_quotes_its_rows_obligation_ids: true
  every_case_in_scope_is_pinned_and_the_version_is_named: false
  every_case_names_the_requirement_it_proves_not_a_test: true
  existing_cases_were_checked_before_new_ones_were_written: true

expected_of_the_receiver:
  - "answer for every id in `review_scope.cases` by name - an unreviewed row makes the verdict
     `partial`, and its id reaches the gate A message"
  - "review the pinned `case_version` above; a review of bytes that have since changed is not a
     review of this window"
  - "every finding carries `expected` and `check` - see s4-case-critic-to-designer"

# What you tried and saw, one row per attempt: the acceptor of the stage reads it against your Good outcome
# (spec t-1765 B3). Empty only with `tried_note` saying why nothing was tried (a grounding window, a repair of
# named findings). Distinct from `blocked.tried` below, which is what failed while filling this form.
tried:
  - requirement: R-5
    technique: State transitions
    observation: "Q4 placeholder replaced: 201, 201, one line of 5; replace and duplicate bugs go red"
    evidence: "test-cases/cart/LOCAL-1_TC_007.md#Then"
  - requirement: R-7
    technique: Boundary value analysis
    observation: "stock 5 with 3 in cart: +2 accepted, +3 refused INSUFFICIENT_STOCK, stock 0 OUT_OF_STOCK"
    evidence: "test-cases/cart/LOCAL-1_TC_009.md#Then"
  - requirement: R-9
    technique: The negative twin
    observation: "negative twin: foreign PUT/DELETE leaves owner's line, read by the same account's allowed GET"
    evidence: "test-cases/cart/LOCAL-1_TC_011.md#Then"
  - requirement: R-4
    technique: Equivalence partitioning
    observation: guest A=12 over stock 10 unreachable by POST (R-7); stock lowered after the add
    evidence: "test-cases/cart/LOCAL-1_TC_005.md#Steps"
  - requirement: cart
    technique: Error guessing
    observation: all 20 existing cases reused and updated in place; no new files, none duplicated
    evidence: work/test-cases/critic-findings.md
tried_note: <why the table is empty, or a dash when it has rows>

unresolved:
  - id: LOCAL-1_TC_006
    reason: contradicts_requirement
    detail: code logs the merge failure and shows success; expected red against R-12
  - id: LOCAL-1_TC_011
    reason: expectation_unconfirmed
    detail: no source names a status or code for a foreign PUT/DELETE; Then asserts only 'unchanged'

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>

# Values code filled from the artifacts on disk when the check ran. They are the
# artifacts' word, not the author's; the receiving role may refuse any of them.
derived:
  - field: inputs_read[1].version
    source: "sha256 of work/requirements-register.md"
