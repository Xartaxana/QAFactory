# Requirements that disagree with each other or with a source. Both readings travel: the plan row
# carries `source_conflict` or `oracle_unknown`, the design review is forced, and the owner sees
# BOTH readings at gate A. A matrix cell that reaches no plan row is an exit-gate error at S3.
contradiction_matrix:
  - id: <C-n>
    requirement: <R-n>
    contradicts: <R-m, or the source and what it says>
    reading_a: <what follows if the requirement stands>
    reading_b: <what follows if the other side stands>
    owner_role: <one of vocabulary.question_owners - po_ba|dev_arch|qa>

# Questions that block understanding. Each travels whole - the statement, what the sources say and
# where, and the lettered readings with what each one costs. A question that arrives without its
# readings goes back to this role, never to the person (REF-2).
open_questions:
  - id: Q1
    statement: may current code plus AUTH.md and openapi be the oracle for the cart
    owner_role: po_ba
    severity: non_blocking
    sources_say: only two generic ACs, no tracker stories (CART-1.md)
    readings:
      - id: a
        reading: see readiness.json for both readings
        cost: Use docs and code as oracle; rows without a document stay code-observed
  - id: Q2
    statement: should a guest cart survive registration then login
    owner_role: po_ba
    severity: non_blocking
    sources_say: "RegisterPage.tsx:46 has no merge call; AUTH.md:8 says login merges"
    readings:
      - id: a
        reading: see readiness.json for both readings
        cost: Test as a bug if the cart is lost; else record as known
  - id: Q3
    statement: expected cart page behaviour for emptied quantity and failed fetch
    owner_role: dev_arch
    severity: non_blocking
    sources_say: "CartPage.tsx:65 sends NaN; :30-38 no response.ok check"
    readings:
      - id: a
        reading: see readiness.json for both readings
        cost: Assert guard and error if required; else not tested
  - id: Q4
    statement: is concurrent add of one book in scope
    owner_role: dev_arch
    severity: non_blocking
    sources_say: "cartService.ts:39-67 findFirst then create is not atomic"
    readings:
      - id: a
        reading: see readiness.json for both readings
        cost: Needs a parallel API check; else out of scope

size:
  computed: XXL
  override: <the role's override, or a dash>
  reasoning_ref: work/sizing.json

artifacts:
  register: work/requirements-register.md
  readiness: work/requirements-readiness.json
  understanding: understanding.md
  sizing: work/sizing.json

claims:
  every_hunk_of_the_diff_was_read: true
  every_requirement_has_an_observable_or_says_none: true
  contradiction_matrix_walked_in_full: true
  size_computed_by_sizing_py_not_quoted: true
  size_recorded_in_pipeline: false  # `null` in pipeline.json while sizing.json said XXL

expected_of_the_receiver:
  - "every requirement above reaches a plan row, or is named `deferred` with a reason - the
     strategist may not drop one silently and may not invent one"
  - "a row touched by the contradiction matrix carries `source_conflict: true` or
     `oracle_unknown: true` and forces design review at S4"
  - "`observable: none` is a gate A question, never a reason to skip the requirement"

unresolved:
  - id: <R-n or Q-n>
    reason: <one of vocabulary.unresolved_reasons - blocked_by_check|blocked_by_env|contradicts_requirement|expectation_unconfirmed|handed_to_person|impossible|pending_implementation>
    detail: <what exactly is missing, and what would settle it>

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>

# Values code filled from the artifacts on disk when the check ran. They are the
# artifacts' word, not the author's; the receiving role may refuse any of them.
derived:
  - field: inputs_read[1].version
    source: "sha256 of work/context-bundle.json"
  - field: size.computed
    source: "sizing.json"
  - field: claims.size_computed_by_sizing_py_not_quoted
    source: "verified by handoff_check.CLAIMS"
