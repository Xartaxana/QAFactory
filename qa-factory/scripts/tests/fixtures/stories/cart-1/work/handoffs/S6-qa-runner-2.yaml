# S6 -> S7: the run is handed to the failure analyst.
#
# The analyst gives every failure a verdict with evidence, so what it needs is not the summary but
# the join: which row, which instance, which artifact, on which build. A row the reducer could not
# join to a manifest instance decided `execution_status` for a whole story once, and nothing said
# it was a ghost - so this file names the ghosts too, and says which rerun superseded them.
#
# `env_blocked` rows carry a remedy and the `env_probe` line that failed. A blocked row with no
# remedy is refused by `validate_artifacts.py`, and rightly: "the stand is wrong" with nothing to
# do about it is not a finding, it is a shrug.
# Fill: write your fields as "path: value" lines to work/handoffs/S6-qa-runner-2.values.yaml in one Write, or run handoff_check.py --file work/handoffs/S6-qa-runner-2.yaml --fix --values - (Bash); a Write over this form is refused, and while that file waits an Edit here is refused too.
schema_version: 1
contract: s6-runner-to-analyst
stage: S6
from_role: qa-runner
to_role: qa-failure-analyst

inputs:
  - path: work/handoffs/S6-qa-runner-2.yaml
    what: this file
    required: true
  - path: work/run-report.json
    what: the whole-story report, reduced by finalize_task.py and never hand-written
    required: true
  - path: work/automation-manifest.json
    what: the instances the rows join to, with their cases and obligations
    required: true
  - path: work/evidence/
    what: the artifact behind every row - logs, screenshots, manual observations
    required: true
  - path: test-plan.md
    what: each row's oracle
    required: true

inputs_read:
  - path: work/handoffs/<the automator's file>.yaml
    version: S5
    instances_handed: 0
  - path: work/handoffs/<the designer's manual file>.yaml
    version: S6-qa-runner-2
    manual_cases_handed: 2
  - path: work/handoffs/S6-qa-runner-1.yaml
    version: S6-qa-runner-1

header:
  role: qa-runner
  stage: S6
  window: CART-1_TC_011,CART-1_TC_012
  verdict: ok

run:
  execution_status: passed
  report: work/run-report.json
  witness: qa-factory/artifacts/CART-1/evidence/runs/c9286026d096394cd0e6/initial-c9286026d096394cd0e6-20261031-113621.json exit 0 1 passed
  environment: local
  application_build: MyBooks a25b0801669b97d76f96f5a981fdc9ad4525d63d (person-confirmed identity)
  probe_before: work/evidence/manual/CART-1_TC_011/a7/probes.jsonl
  probe_after: work/evidence/manual/CART-1_TC_011/a7/probes.jsonl
  totals: "{\"failed\": 2, \"not_run\": 6, \"passed\": 34}"
  # The reduced report counts every attempt the story ever made: on REF-1 `totals` read
  # 69 not_run beside a current window of 20 rows. The next role is answering about THIS window,
  # so the window's own numbers travel beside the story's.
  window_totals: "{\"failed\": 1, \"passed\": 17}"

# One row per item executed or deliberately not executed. `state` from vocabulary.row_states:
# passed, failed, error, skipped, not_run, passed_green (a reused receipt), inconclusive,
# manual_skipped, env_blocked, broken_run, timeout.
scope:
  - id: CART-1_TC_011
    state: passed  # `blocked` needs `blocked.problem` below; the stand's word is `blocked_by_env`; a factory refusal of your run is `header.verdict: halt`
    reason: detail-page add, above-stock error and sold-out partitions observed
    case: CART-1_TC_011
    obligations: OB-11
    executed: fresh
    rerun_reason: none
    evidence: work/evidence/manual/CART-1_TC_011/a7
    duration: -
  - id: CART-1_TC_012
    state: passed  # `blocked` needs `blocked.problem` below; the stand's word is `blocked_by_env`; a factory refusal of your run is `header.verdict: halt`
    reason: wishlist move adds 1 copy, removes item; sold-out move disabled
    case: CART-1_TC_012
    obligations: OB-12
    executed: fresh
    rerun_reason: none
    evidence: work/evidence/manual/CART-1_TC_012/a8
    duration: -

# Manual-agent observations, compared with the Then as the case quoted it. This is the section
# that makes `inconclusive` an answer instead of an improvisation.
manual_observations:
  - case: CART-1_TC_011
    then: P-valid qty 2 toast and cart lists D3 x2; P-above-stock error toast, cart still 2; P-soldout button disabled, D0 not in cart
    observed: toasts '2 copies added to cart' and 'Only 3 in stock and 2 already in your cart'; cart D3 subtotal $20 both times; D0 labelled Out of Stock, absent from cart
    before_change: R-1 not_recorded
    result: passed
    evidence: work/evidence/manual/CART-1_TC_011/a7
    why_inconclusive: <what the observation failed to settle, when it did>
  - case: CART-1_TC_012
    then: W1 in cart qty 1; W1 gone from wishlist after reload; W0 move button disabled, not in cart
    observed: cart W1 qty 1 ($10); wishlist only W0 after reload; W0 move button not enabled
    before_change: R-14 not_recorded
    result: passed
    evidence: work/evidence/manual/CART-1_TC_012/a8
    why_inconclusive: <what the observation failed to settle, when it did>

# Rows blocked by the stand. Every one names the remedy - names only, never a value - and the
# `env_probe.py` line that failed.
env_blocked:
  - id: none
    probe_line: none
    remedy: none
    owner: factory

# Rows that exist in the report but are not evidence about this story: a ghost the reducer could
# not join, superseded by a rerun under the real instance ids.
superseded:
  - row: none
    superseded_by: none
    note: "a rerun is a repair, not an attempt anyone has to waive"

claims:
  every_row_carries_an_evidence_path: true
  every_blocked_row_names_a_remedy_and_the_probe_line: true
  no_comparison_was_fabricated_where_before_evidence_is_missing: true
  handed_and_manual_human_cases_are_absent_by_design: true
  the_report_was_reduced_by_code_not_written: true

expected_of_the_receiver:
  - "triage every `failed`, every `error`, and every `inconclusive` - an inconclusive check has
     an owner and a next step and never reaches gate B untouched"
  - "a red instance carrying `contradicts_requirement` goes through your rule 2d. A red on an
     extra or different value gets the control experiment first; the expectation is never
     adjusted to the code"
  - "a FLAKY verdict needs three isolated reruns of that one test and a named mechanism"

unresolved:
  - id: <instance or case id>
    reason: <one of vocabulary.unresolved_reasons - blocked_by_check|blocked_by_env|contradicts_requirement|expectation_unconfirmed|handed_to_person|impossible|pending_implementation>
    detail: <what exactly is missing, and what would settle it>

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>

# Values code filled from the artifacts on disk when the check ran. They are the
# artifacts' word, not the author's; the receiving role may refuse any of them.
derived:
  - field: run.witness
    source: "automation-manifest.run_witness"
  - field: run.totals
    source: "run-report.totals"
  - field: run.window_totals
    source: "run-report.current_totals"
