# S3 -> S4: the test plan is handed to the case designer.
#
# The plan is the only place where the factory decides what it will NOT do, so every row carries a
# disposition and a reason, and every requirement of the register reaches a row or is named here as
# deferred. The designer expands rows into cases; it does not re-plan, and it cannot ask for
# something the row did not say.
#
# The field this file exists for is `obligations`. On REF-1 not one of the nineteen test
# instances named an obligation id, so nothing downstream could answer "which plan row does this
# test discharge" - the roll-call at S4, the scope check at S5 and the traceability table at S8 all
# had to re-derive it from case names. Obligation ids are minted HERE, once, and travel unchanged.
# Fill: write your fields as "path: value" lines to work/handoffs/S3-qa-test-strategist-1.values.yaml in one Write; a Write over this form is refused, and while that file waits an Edit here is refused too.
schema_version: 1
contract: s3-strategist-to-designer
stage: S3
from_role: qa-test-strategist
to_role: qa-case-designer

inputs:
  - path: work/handoffs/S3-qa-test-strategist-1.yaml
    what: this file
    required: true
  - path: work/test-plan.json
    what: the machine plan - rows, dispositions, obligations, coverage contract revisions
    required: true
  - path: test-plan.md
    what: the same plan in the words the person reads at gate A
    required: true
  - path: work/requirements-register.md
    what: the oracle; a case is written against the requirement, never against a test name
    required: true

inputs_read:
  - path: work/requirements-register.md
    version: register ids R-1..R-16
    requirements: 16
  - path: work/context-bundle.json
    version: ed92ac22589c426c597acd5371f76421789012550af43750859b2ed3632a0136
    existing_candidates_considered: 2 of 2

