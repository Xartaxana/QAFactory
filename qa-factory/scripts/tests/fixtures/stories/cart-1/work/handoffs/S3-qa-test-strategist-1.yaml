# Every requirement of the register either reaches a row above or is named here. The S3 exit gate
# checks the sum: this is the place where scope is knowingly narrowed, and the only one.
not_planned:
  - requirement: R-9
    state: unverifiable
    reason: No source states the expectation; gate-A question Q2.
  - requirement: R-13
    state: unverifiable
    reason: Expected cart page behaviour unconfirmed; gate-A question Q3.
  - requirement: R-16
    state: unverifiable
    reason: Observable none; gate-A question Q4.

# For every manual row, what the runner will be allowed to count as evidence. Deciding this at S3
# is the rule of the phase: on REF-1 the runner reached a manual case with no policy and
# the observation it produced settled nothing.
manual_policy:
  - row: TS-11
    executed_by: agent
    evidence: before and after screenshots with actual steps
    required_fields: steps taken, toast text, cart page rows, button state
    inconclusive_when: evidence missing or final state not read
  - row: TS-12
    executed_by: agent
    evidence: before and after screenshots of wishlist and cart
    required_fields: steps taken, wishlist rows, cart rows
    inconclusive_when: evidence missing or final state not read

budget:
  size: XXL
  cap: 28
  planned_rows: 12
  within_cap: false
  if_over: Nothing cut; computed 32 vs cap 28 goes to gate A; lowest-impact tail TS-12, TS-11, TS-7 first.

# Regression the person may want to run. The factory does not run it and says so.
regression_recommendations:
  - suite_or_command: run_suite.py --label cart -- npm --prefix ../MyBooks run test -- src/lib/cartRules.test.ts
    why: Developer-owned unit defence of the stock and merge rules.

artifacts:
  plan_machine: work/test-plan.json
  plan_human: test-plan.md
  judge_plan: <work/judge-plan.json, when a judge is configured>

claims:
  every_register_requirement_reaches_a_row_or_is_in_not_planned: true
  every_row_has_a_disposition_and_a_reason: true
  every_row_mints_obligation_ids: true
  every_contradiction_matrix_cell_reached_a_row: true
  no_test_was_run_in_this_stage: true

expected_of_the_receiver:
  - "one or more cases per row with `automate` or a manual disposition; a row with `skip` or
     `unverifiable` gets no case and is not re-argued"
  - "every case quotes the obligation ids of its row - unchanged, not re-derived"
  - "reuse or extend an existing case before writing a new one, as the row says"
  - "a row with `source_conflict` or `oracle_unknown` keeps both readings in the case, and the
     contested assertion is not automated until the owner answers at gate A"

unresolved:
