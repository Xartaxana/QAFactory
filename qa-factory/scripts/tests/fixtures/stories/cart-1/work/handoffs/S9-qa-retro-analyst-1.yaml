# S9 -> the project: what outlives this story is handed to the next one.
#
# The only handoff that crosses stories. Everything else in this folder is read within hours by a
# role that is already waiting; these rows are read by an S0 that does not exist yet, possibly on
# another ticket in another month, and nobody will be there to explain them. So a row here names
# its own trigger: what has to be true for the next story to care about it.
#
# `obligations.md` is the single carrier between stories. A trap written into two strategy
# documents fails audit A21, so every trap names one owning document and only one - code and run
# traps to framework-rules.md, planning traps to test-strategy.md.
#
# Nothing is archived here. Hiding a story from the dashboard and the doctor is the person's word
# to `qa-doctor`, never a role's conclusion.
# Fill: write your fields as "path: value" lines to work/handoffs/S9-qa-retro-analyst-1.values.yaml in one Write, or run handoff_check.py --file work/handoffs/S9-qa-retro-analyst-1.yaml --fix --values - (Bash); a Write over this form is refused, and while that file waits an Edit here is refused too.
schema_version: 1
contract: s9-retro-to-project
stage: S9
from_role: qa-retro-analyst
to_role: project

inputs:
  - path: work/handoffs/S9-qa-retro-analyst-1.yaml
    what: this file
    required: true
  - path: retro.md
    what: the prose over numbers already computed
    required: true
  - path: work/retro-numbers.json
    what: the facts; no model does this arithmetic
    required: true

inputs_read:
  - path: work/retro-numbers.md
    version: 48e675f0f83d87d8
  - path: work/handoffs/<the gate B file>.yaml
    version: 48e675f0f83d87d8
    decisions_folded: 35

header:
  role: qa-retro-analyst
  stage: S9
  window: CART-1
  verdict: concerns

retro_mode: full
feedback:
  question: "One question for the retro: what did you dislike in this session, what should change?"
  answer: declined

# Rows the next story reads. `state` is normally `filed` (written into the project ledger) or
# `routed` (handed to a document outside this story).
scope:
  - id: FB-6
    state: filed
    reason: TypeScript tooling gaps filed to factory backlog
    text: TS project vs pytest-oriented factory tooling
    trigger: next story on a Playwright TypeScript project
    owner: factory

# Each trap goes into exactly ONE document. Naming the document here is what makes that checkable.
knowledge_fold:
  - fact: <one line - the trap, the term, the stand quirk, the owner's answer>
    kind: <code_trap|run_trap|planning_trap|term|stand_quirk|gate_answer>
    document: <project:strategy/framework-rules.md | project:strategy/test-strategy.md |
               project:strategy/faq.md | project:project-profile.md | project:glossary.md>
    written: <true|false>
    as_proposal_in_report: <true|false>   # true when the owning file has no editable grant

factory_backlog:
  - id: <backlog id>
    text: <one line>
    from: <the run's own finding, or the person's feedback row>

numbers:
  estimation_ledger_line: written
  orchestrator_share: not published - price is a floor (INCOMPLETE)
  stages_out_of_order: none reported
  note: "both are findings about the factory, not work the person owes"

delivery_bookkeeping:
  manifest_rebuilt: false
  post_s9_update: not_applicable
  pending_paths: "<the exact paths waiting, when gate B did not authorise this target>"

claims:
  every_trap_names_exactly_one_owning_document: true
  nothing_was_archived_by_a_role: true
  the_feedback_answer_is_verbatim_or_declined: true
  the_dashboard_was_rebuilt: true

unresolved:
  - id: <obligation or fold row>
    reason: <one of vocabulary.unresolved_reasons - blocked_by_check|blocked_by_env|contradicts_requirement|expectation_unconfirmed|handed_to_person|impossible|pending_implementation>
    detail: <what exactly is missing, and what would settle it>

blocked:
  field: <the field of this file the role cannot fill>
  problem: <what the role tried and what refused it, verbatim>
  tried:
    - <command or step, and its answer>
  data:
    - <path of anything the conductor needs to see>

# Values code filled from the artifacts on disk when the check ran. They are the
# artifacts' word, not the author's; the receiving role may refuse any of them.
derived:
  - field: inputs_read[0].version
    source: "sha256 of work/retro-numbers.md"
